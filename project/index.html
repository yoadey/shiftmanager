<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ShiftManager — TSC Schwarz-Gelb Aachen</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { height: 100%; background: #2A2722; }
  body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden; }
  #root { height: 100%; }

  .stage {
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(1200px 600px at 50% -10%, #3a352c 0%, transparent 60%),
      linear-gradient(180deg, #2A2722 0%, #1f1c18 100%);
    overflow: hidden;
  }

  /* role switcher chrome */
  .rolebar {
    flex-shrink: 0; width: 100%; max-width: 520px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px 14px; gap: 12px;
  }
  .rb-brand { display: flex; align-items: center; gap: 9px; color: #fff; font-weight: 800; font-size: 16px; font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em; }
  .rb-logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--primary, #F4B63F); color: #1A1813;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; font-family: 'Bricolage Grotesque';
  }
  .rb-seg { display: flex; gap: 3px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 4px; }
  .rb-btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 13px;
    padding: 8px 16px; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.62);
    transition: all .16s;
  }
  .rb-btn.active { background: var(--primary, #F4B63F); color: #1A1813; }

  .scaler { transform-origin: top center; flex-shrink: 0; }

  @media (max-width: 519px) {
    .rolebar { padding: 10px 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app/components.jsx"></script>
<script type="text/babel" src="app/member.jsx"></script>
<script type="text/babel" src="app/event.jsx"></script>
<script type="text/babel" src="app/admin.jsx"></script>
<script type="text/babel" src="app/admin2.jsx"></script>
<script type="text/babel" src="app/main.jsx"></script>
</body>
</html>
