services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - vscode-extensions:/root/.vscode-server/extensions
      - go-cache:/root/.cache/go-build
      - npm-cache:/root/.npm
    command: sleep infinity
    environment:
      - TZ=Europe/Berlin
    networks:
      - shiftmanager-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shiftmanager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - shiftmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dex:
    image: ghcr.io/dexidp/dex:v2.38.0
    ports:
      - "5556:5556"
    volumes:
      # Du musst eine lokale dex-config.yaml anlegen und hier mounten
      - ./dex-config.yaml:/etc/dex/config.docker.yaml
    networks:
      - shiftmanager-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shiftmanager-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  vscode-extensions:
  go-cache:
  npm-cache:

networks:
  shiftmanager-network:
    driver: bridge
