# ============================================================
# ShiftManager — Redis 7 (optional)
#
# Redis is NOT required. The application falls back to
# in-memory caching/session storage when REDIS_URL is empty.
# Deploy Redis if you want session persistence across pod
# restarts or plan to run more than one API replica.
#
# Apply manually when needed:
#   kubectl apply -f deploy/kubernetes/redis-deployment.yaml
#
# Or skip it entirely for single-node, low-traffic deployments.
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shiftmanager
  labels:
    app.kubernetes.io/name: shiftmanager
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shiftmanager
      app.kubernetes.io/component: redis
  strategy:
    type: Recreate  # Redis with no persistence — recreate is fine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shiftmanager
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory
            - 56mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999  # redis user in alpine image

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shiftmanager
  labels:
    app.kubernetes.io/name: shiftmanager
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shiftmanager
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
