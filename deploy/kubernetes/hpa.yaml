---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shiftmanager-api
  namespace: shiftmanager
  labels:
    app.kubernetes.io/name: shiftmanager
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shiftmanager-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Stabilize scale-down to avoid flapping on short-lived load spikes
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Replicas
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Replicas
          value: 1
          periodSeconds: 30
