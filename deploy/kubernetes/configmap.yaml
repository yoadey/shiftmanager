---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shiftmanager-config
  namespace: shiftmanager
  labels:
    app.kubernetes.io/name: shiftmanager
    app.kubernetes.io/component: api
data:
  # HTTP server port
  PORT: "8080"

  # Log verbosity: trace | debug | info | warn | error
  LOG_LEVEL: "info"

  # Public base URL used for building callback links and email hrefs.
  # Update this to your actual domain after configuring ingress.
  BASE_URL: "https://shiftmanager.example.com"

  # Display name used before club branding is loaded from the database.
  CLUB_NAME: "TSC Schwarz-Gelb Aachen"

  # Go runtime soft memory limit — set to ~80% of the container memory limit.
  # See: https://pkg.go.dev/runtime/debug#SetMemoryLimit
  GOMEMLIMIT: "200MiB"
