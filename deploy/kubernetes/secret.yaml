# ============================================================
# ShiftManager — Kubernetes Secret
#
# IMPORTANT: This file contains PLACEHOLDER values.
# Replace every <...> token with your actual secrets before
# applying, or better yet: manage these with Sealed Secrets
# (https://github.com/bitnami-labs/sealed-secrets) or the
# External Secrets Operator (https://external-secrets.io)
# so that plaintext credentials are never committed to git.
#
# To encode a value:  echo -n 'my-value' | base64
# ============================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: shiftmanager-secret
  namespace: shiftmanager
  labels:
    app.kubernetes.io/name: shiftmanager
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgres://USER:PASSWORD@HOST:PORT/DBNAME?sslmode=require
  DATABASE_URL: "postgres://shiftmanager:<DB_PASSWORD>@postgres:5432/shiftmanager?sslmode=require"

  # Redis connection string — leave empty to use in-memory fallback
  REDIS_URL: "redis://redis:6379"

  # OIDC / Keycloak
  OIDC_ISSUER: "https://your-keycloak.example.com/realms/shiftmanager"
  OIDC_CLIENT_ID: "shiftmanager"
  OIDC_CLIENT_SECRET: "<OIDC_CLIENT_SECRET>"
  OIDC_REDIRECT_URL: "https://shiftmanager.example.com/auth/callback"

  # JWT signing secret — generate with: openssl rand -hex 32
  JWT_SECRET: "<JWT_SECRET_32_CHARS>"

  # SMTP credentials
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "shiftmanager@example.com"
  SMTP_PASS: "<SMTP_PASSWORD>"
  SMTP_FROM: "ShiftManager <shiftmanager@example.com>"
