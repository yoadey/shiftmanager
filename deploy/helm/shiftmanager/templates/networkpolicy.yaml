{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shiftmanager.fullname" . }}
  labels:
    {{- include "shiftmanager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shiftmanager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic to the app port (from ingress controllers / mesh).
    - ports:
        - port: http
          protocol: TCP
  egress:
    # DNS resolution.
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Everything else (PostgreSQL, Redis, external OIDC and SMTP). Tighten to
    # specific CIDRs/namespaceSelectors in hardened environments.
    - {}
{{- end }}
