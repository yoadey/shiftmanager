{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shiftmanager.fullname" . }}
  labels:
    {{- include "shiftmanager.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "app.jwtSecret is required (generate with: openssl rand -hex 32) or provide existingSecret" .Values.app.jwtSecret | quote }}
  DATABASE_URL: {{ include "shiftmanager.databaseUrl" . | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.app.oidc.clientSecret | quote }}
  SMTP_PASS: {{ .Values.app.smtp.password | quote }}
  {{- $redisUrl := include "shiftmanager.redisUrl" . }}
  {{- if $redisUrl }}
  REDIS_URL: {{ $redisUrl | quote }}
  {{- end }}
{{- end }}
